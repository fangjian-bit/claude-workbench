name: pr-title

# Its own file, not a job in ci.yml: ci.yml's `pull_request` trigger uses the default
# types, which leave out `edited`, so retitling a PR would not re-run the check there, and
# adding `edited` to ci.yml would re-run every job in it on each PR body edit.
#
# Not a required check yet. The job runs the PR's own script against the PR's own
# CLAUDE.md, so it catches scope drift, not a PR that edits the area list, the script or
# this workflow.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the PR title's scope against CLAUDE.md's areas
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/pr-title-check.sh "$PR_TITLE"
