name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the claude CLI
        # Unpinned `npm install -g` on purpose, per .github/dependabot.yml's SCOPE/NOT
        # COVERED notes: this is the PR-time install (wants latest), not the
        # release-time one (`release.yml` pins a version for reproducibility). There is
        # no package.json for this single global CLI install to lock against, on either
        # path.
        run: npm install -g @anthropic-ai/claude-code # zizmor: ignore[adhoc-packages]
      - name: Validate plugin manifests and skill frontmatter
        run: bash scripts/lint.sh

  # Deliberately its own job, not a step in `lint`: this gate answers a different
  # question (is the plugin still portable?) and needs no toolchain, so it reports a
  # verdict even when the CLI install fails. Job id == check-run name, so this name is
  # what a required-checks list would have to carry.
  coupling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No repo-specific literals in any plugins/*/ entry except reference/, .claude-plugin/, .git/
        run: bash scripts/coupling-check.sh

  # Also its own job, for the same reason `coupling` is: it answers a third question --
  # has a specific already-shipped defect come back? -- and should report a verdict
  # independently of the other two. No toolchain to INSTALL (ubuntu-latest ships mikefarah
  # yq and jq already), but WB-D17 (#142) made yq a hard dependency of this job's own
  # schema-completeness assertions, and check 20 (#698) does the same for jq -- a runner
  # image without either must fail this gate, not silently skip them.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No known-wrong form has returned
        run: bash scripts/invariants-check.sh
      # The one guard that the review-match program in architect-review-gate.yml and its
      # copy in scripts/identity/wow-review (decide_already) stay identical (#866); `tests`
      # is not a required check, this job is.
      - name: review-match program and its copy agree
        run: sh tests/review-verdict.test.sh

  # Also its own job: fixture tests for the plugin's bin/ scripts (see issue #21 --
  # deterministic predicates extracted from skill prose belong in tested scripts), for
  # its hooks/ (the SessionStart banner, see issue #88), and for the CI gates themselves
  # (see issue #53 -- a gate that stops gating looks exactly like a gate that passed, so
  # its fail-closed behaviour is pinned by fixtures too), and for the App-mode review
  # image's entrypoint, outbox reader, Dockerfile and build context (#634).
  # Split in three parallel jobs (#808): this one runs every tests/*.test.sh through
  # scripts/test-all.sh (files run concurrently; a failed file's log is printed) except
  # the two launcher suites, which `tests-launchers` and `tests-review-launcher` run
  # alone, so each file runs in one of the three (review-verdict also runs in
  # `invariants`). A new tests/X.test.sh needs no edit here.
  # Not yet in {ruleset.required_checks} -- see the PR that added this job. The same
  # goes for the two launcher jobs.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every suite except the two launcher suites
        run: bash scripts/test-all.sh -x identity-launchers.test.sh -x identity-review.test.sh

  tests-launchers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: host driver launcher fixtures
        run: sh tests/identity-launchers.test.sh

  # Alone in its job: its header's Runtime note bounds it as a suite that runs alone.
  tests-review-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: wow-review launcher fixtures
        run: sh tests/identity-review.test.sh

  # WB-D15 (#45): workflow security scanner, modeled on bounty-infra's own `zizmor` job
  # (`ci.yml`). Unchained like `coupling`/`invariants` above -- a future required check
  # should report its own conclusion as fast as it can, and this job doesn't depend on
  # lint having passed.
  #
  # `security-events: write` is job-scoped, not added to the workflow-wide `permissions:`
  # block above -- it is the one job here that needs it (to upload SARIF to the Security
  # tab; public repos get GitHub Advanced Security free), every other job stays at the
  # workflow default of `contents: read`.
  #
  # Not a required check yet (WB-D15) -- promoting it to `ruleset.required_checks` is a
  # later human call, once it has a track record.
  #
  # TWO zizmor-action runs, not one. Verified by reading action.sh at this pin, then
  # reproducing live (`zizmor . --format=sarif` exits 0 on a real finding; `zizmor .
  # --format=github` exits 13 on the same finding): `advanced-security: true` (the
  # action's default) passes `--format=sarif` to zizmor, and in THAT format zizmor
  # itself always exits 0, whatever it finds -- SARIF mode is upload-only, it does not
  # gate. A first version of this job set no inputs at all and inherited that default,
  # so it could never fail no matter what a PR introduced. The first run below is the
  # actual gate (`advanced-security: false`, `annotations: true`; no `--min-severity` or
  # `--min-confidence` is set, so it fails on any finding that isn't `# zizmor:
  # ignore[...]`-suppressed, the same as `lint`/`coupling`/`invariants` failing on
  # theirs). The second is upload-only, with `if: !cancelled()` so a red gate still
  # uploads its findings to the Security tab instead of silently skipping.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor (gate)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
      - name: Run zizmor (upload SARIF)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
