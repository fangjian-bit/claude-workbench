name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the claude CLI
        # Unpinned `npm install -g` on purpose, per .github/dependabot.yml's SCOPE/NOT
        # COVERED notes: this is the PR-time install (wants latest), not the
        # release-time one (`release.yml` pins a version for reproducibility). There is
        # no package.json for this single global CLI install to lock against, on either
        # path.
        run: npm install -g @anthropic-ai/claude-code # zizmor: ignore[adhoc-packages]
      - name: Validate plugin manifests and skill frontmatter
        run: bash scripts/lint.sh

  # Deliberately its own job, not a step in `lint`: this gate answers a different
  # question (is the plugin still portable?) and needs no toolchain, so it reports a
  # verdict even when the CLI install fails. Job id == check-run name, so this name is
  # what a required-checks list would have to carry.
  coupling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No repo-specific literals in any plugins/*/ entry except reference/, .claude-plugin/, .git/
        run: bash scripts/coupling-check.sh

  # Also its own job, for the same reason `coupling` is: it answers a third question --
  # has a specific already-shipped defect come back? -- and should report a verdict
  # independently of the other two. No toolchain to INSTALL (ubuntu-latest ships mikefarah
  # yq and jq already), but WB-D17 (#142) made yq a hard dependency of this job's own
  # schema-completeness assertions, and check 20 (#698) does the same for jq -- a runner
  # image without either must fail this gate, not silently skip them.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No known-wrong form has returned
        run: bash scripts/invariants-check.sh
      # The one guard that the review-match program in architect-review-gate.yml and its
      # copy in scripts/identity/wow-review (decide_already) stay identical (#866); the
      # test shards run this suite too, but they are skipped for a cursor-sync-only PR and this
      # job never is. WOW_TESTS_REQUIRE_TOOLS=1 makes a missing jq fail the suite, not skip it (#930).
      - name: review-match program and its copy agree
        env:
          WOW_TESTS_REQUIRE_TOOLS: "1"
        run: sh tests/review-verdict.test.sh

  # Lists the PR's changed paths and says whether every one is a cursor-sync file (#989), so
  # the five test check runs below can skip a PR that touches nothing else. The skip is an `if`
  # (job-level on the launcher and Windows jobs, step-level on the shard matrix job), not a
  # workflow-level `paths-ignore`: a skipped job still reports under its own name, and the
  # shard legs conclude `success` under theirs, so the required checks stay satisfied.
  # `lint`, `coupling`, `invariants`, `zizmor` and (in its own file) `pr-title` never wait on
  # this job and always run.
  #
  # The predicate is the BASE's copy of scripts/cursor-only-paths.sh, so a PR's own change to it
  # cannot decide its own skip; when the base has no copy (as on the PR that added it) the output
  # is `false`. The output can be `true` only when the PR targets `main`: a PR opened against a
  # side branch could otherwise skip its tests and then be retargeted to `main`, and retargeting
  # is an `edited` event, which this workflow does not re-run on. `--no-renames` matters: a rename
  # would list only its new path, so moving a suite into .ai/parked/ would read as cursor-only.
  # A failure writes `false`, or leaves the output unset when the step dies first; the test jobs
  # read both as "run". Under `pull_request` a PR's own ci.yml is the one that runs, so this
  # guards the predicate only: a change to this file is a `.github/workflows/` change, which
  # `architect-review` gates.
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      cursor_only: ${{ steps.paths.outputs.cursor_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Are all changed paths cursor-sync files
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          result=false
          if [ "$BASE_REF" = main ] && git show HEAD^1:scripts/cursor-only-paths.sh >"$RUNNER_TEMP/cursor-only-paths.sh"; then
            if list="$(git diff --no-renames --name-only HEAD^1 HEAD)" \
              && word="$(printf '%s\n' "$list" | sh "$RUNNER_TEMP/cursor-only-paths.sh")" \
              && [ "$word" = true ]; then
              result=true
            fi
          fi
          echo "cursor_only=$result"
          echo "cursor_only=$result" >>"$GITHUB_OUTPUT"

  # Also its own job: fixture tests for the plugin's bin/ scripts (see issue #21 --
  # deterministic predicates extracted from skill prose belong in tested scripts), for
  # its hooks/ (the SessionStart banner, see issue #88), and for the CI gates themselves
  # (see issue #53 -- a gate that stops gating looks exactly like a gate that passed, so
  # its fail-closed behaviour is pinned by fixtures too), and for the App-mode review
  # image's entrypoint, outbox reader, Dockerfile and build context (#634).
  # Split in four parallel check runs (#808, #936): the two shards, `tests-1` and `tests-2`, run
  # every tests/*.test.sh through scripts/test-all.sh (files run concurrently; a failed file's
  # log is printed) except the two launcher suites, which `tests-launchers` and
  # `tests-review-launcher` run alone. The shards split the sorted glob minus those two: numbered
  # from 0 in glob order, shard 1 owns the even positions and shard 2 the odd ones, and each
  # leaves the other's files out with -x. So each file runs in exactly one of the four check runs
  # (review-verdict also runs in `invariants`, identity-broker also in `tests-windows`), and a
  # new tests/X.test.sh needs no edit here (it can move later files to the other shard). Each
  # shard writes the suites that skipped to its job summary (-s).
  #
  # The two shards are one matrix job: its `name:` gives the check runs `tests-1` and `tests-2`,
  # and `tests-launchers` and `tests-review-launcher` are named by their job ids. These four
  # names are required checks ({ruleset.required_checks}, #989). Adding a required job is merge
  # first, then pin it in the live ruleset to GitHub Actions (the rollout order WB-D37 records in
  # docs/decisions.md); renaming one blocks its own PR until the ruleset changes too, so keep
  # the names stable. Each job declares `needs: changed-paths` and skips when every changed path
  # is a cursor-sync file. The launcher jobs skip at job level. The shards skip at step level:
  # a matrix job skipped by its job-level `if` is not expanded, so it would report no check run
  # named `tests-1` or `tests-2` and the merge would block; with the `if` on the steps both
  # legs run, skip their steps and conclude `success` under their own names. Every one of
  # these jobs has `always()`, so it still runs when `changed-paths` itself fails or is
  # cancelled: without it a launcher job would report `skipped`, which passes a required check,
  # and the shard job would not expand, leaving `tests-1` and `tests-2` unreported. The cost is
  # that cancelling a run no longer stops a test job that has not started.
  #
  # WOW_TESTS_REQUIRE_TOOLS=1 turns the missing-tool skip of identity-review, identity-launchers
  # and review-verdict into a failure, so CI keeps no second copy of those suites' tool lists
  # (#985, #986). Other suites' skips are named in the job summary instead; the broker suite
  # skips some cases on Linux by design, so a skip verdict is not itself a failure.
  tests:
    name: tests-${{ matrix.shard }}
    needs: changed-paths
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        if: ${{ needs.changed-paths.outputs.cursor_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: This shard's suites, none of the launcher suites
        if: ${{ needs.changed-paths.outputs.cursor_only != 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
          WOW_TESTS_REQUIRE_TOOLS: "1"
        run: |
          case "$SHARD" in 1 | 2) ;; *) echo "SHARD must be 1 or 2, not '$SHARD'" >&2; exit 1 ;; esac
          args=(-x identity-launchers.test.sh -x identity-review.test.sh)
          i=0
          # ls sorts under C collation, which fixes the order; the suites keep the runner's locale.
          while IFS= read -r name; do
            case "$name" in identity-launchers.test.sh | identity-review.test.sh) continue ;; esac
            if [ $((i % 2)) -ne $((SHARD - 1)) ]; then args+=(-x "$name"); fi
            i=$((i + 1))
          done < <(cd tests && LC_ALL=C ls -1d -- *.test.sh)
          bash scripts/test-all.sh "${args[@]}" -s "$GITHUB_STEP_SUMMARY"

  tests-launchers:
    needs: changed-paths
    if: ${{ always() && needs.changed-paths.outputs.cursor_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: host driver launcher fixtures
        env:
          WOW_TESTS_REQUIRE_TOOLS: "1"
        run: sh tests/identity-launchers.test.sh

  # Alone in its job: its header's Runtime note bounds it as a suite that runs alone.
  tests-review-launcher:
    needs: changed-paths
    if: ${{ always() && needs.changed-paths.outputs.cursor_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: wow-review launcher fixtures
        env:
          WOW_TESTS_REQUIRE_TOOLS: "1"
        run: sh tests/identity-review.test.sh

  # The broker suite on Windows (#1017), so its `register-broker-task.ps1 -WhatIf` case runs:
  # on Linux it always skips, because the cmdlets it needs exist only on Windows. Not a required
  # check. It fails when the suite's output still carries the skip line for that case.
  tests-windows:
    needs: changed-paths
    if: ${{ always() && needs.changed-paths.outputs.cursor_only != 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: broker fixtures, -WhatIf case included
        run: |
          out="$(mktemp)"
          rc=0
          sh tests/identity-broker.test.sh >"$out" 2>&1 || rc=$?
          cat "$out"
          if grep -Eq '^SKIP - (pwsh|New-ScheduledTaskAction)' "$out"; then
            echo "the -WhatIf case skipped on the Windows runner" >&2
            exit 1
          fi
          exit "$rc"

  # WB-D15 (#45): workflow security scanner, modeled on bounty-infra's own `zizmor` job
  # (`ci.yml`). Unchained like `coupling`/`invariants` above -- a future required check
  # should report its own conclusion as fast as it can, and this job doesn't depend on
  # lint having passed.
  #
  # `security-events: write` is job-scoped, not added to the workflow-wide `permissions:`
  # block above -- it is the one job here that needs it (to upload SARIF to the Security
  # tab; public repos get GitHub Advanced Security free), every other job stays at the
  # workflow default of `contents: read`.
  #
  # Not a required check yet (WB-D15) -- promoting it to `ruleset.required_checks` is a
  # later human call, once it has a track record.
  #
  # TWO zizmor-action runs, not one. Verified by reading action.sh at this pin, then
  # reproducing live (`zizmor . --format=sarif` exits 0 on a real finding; `zizmor .
  # --format=github` exits 13 on the same finding): `advanced-security: true` (the
  # action's default) passes `--format=sarif` to zizmor, and in THAT format zizmor
  # itself always exits 0, whatever it finds -- SARIF mode is upload-only, it does not
  # gate. A first version of this job set no inputs at all and inherited that default,
  # so it could never fail no matter what a PR introduced. The first run below is the
  # actual gate (`advanced-security: false`, `annotations: true`; no `--min-severity` or
  # `--min-confidence` is set, so it fails on any finding that isn't `# zizmor:
  # ignore[...]`-suppressed, the same as `lint`/`coupling`/`invariants` failing on
  # theirs). The second is upload-only, with `if: !cancelled()` so a red gate still
  # uploads its findings to the Security tab instead of silently skipping.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor (gate)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
      - name: Run zizmor (upload SARIF)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
