name: release

# Cutting a release is a deliberate act, so this is manual. It is NOT `on: push: tags:` --
# that shape can only *check* that a pushed tag matches `plugin.json`, and by then the tag
# exists and consumers may already have fetched it. This workflow DERIVES the tag from
# `plugin.json`, which makes the two structurally incapable of disagreeing rather than
# merely audited. Bump the version in a normal PR; release from `main` afterwards.
#
# Background: `plugin.json` read `0.1.0` while tags were at `v0.3.0`. Nothing was broken by
# it -- the plugin cache tracks the pinned git ref, not this field -- but the cache DIRECTORY
# is named from it, so the one place a human or agent looks to confirm which version is
# installed reported `0.1.0` forever. An illegible install, not a wrong one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and report the release plan without creating the tag or release"
        type: boolean
        # Defaults to the SAFE action: the irreversible path costs one extra click.
        default: true

permissions:
  contents: read

# Two dispatches racing would both clear the local tag guard; the loser then gets a 422
# from the create-only refs API and fails loudly. Serialising is cheaper than reasoning
# about that. Never cancel in progress -- a cancelled release can leave a tag behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Re-run the PR gates against the exact commit being tagged. A tag can point at any
  # commit, and `ci.yml` only runs `on: pull_request` -- which tests the MERGE commit
  # (`refs/pull/N/merge`), not the branch tip -- so "it was green on the PR" is genuinely
  # not the same claim as "it is green at the ref being released".
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # FIRST, before any checkout or any repo script runs.
      #
      # `workflow_dispatch` lets the dispatcher choose ANY ref, and everything downstream --
      # the gate scripts, `plugin.json`, and the commit the tag points at -- comes from that
      # ref. Without this, pushing a branch is equivalent to publishing a release: the
      # branch ruleset protects `main` only, so an unreviewed commit could be tagged, and
      # consumers pin tags exactly. That would route around the one control the repo has.
      #
      # This is a failing assert rather than a job-level `if:` on purpose -- a skipped job
      # reads as a pass in the run summary, and this must be impossible to misread.
      - name: Release only from the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::could not resolve the default branch; refusing to release"
            exit 1
          fi
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::release must be dispatched from $DEFAULT_BRANCH, got $REF"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Pinned so a release is reproducible: unpinned, `verify` runs whatever the registry
      # serves that minute rather than the validator that passed on the PR. Still an
      # ad-hoc `npm install -g`, not a lockfile install -- there is no package.json for
      # this single global CLI to lock against, and pinning the package's own version
      # (above) is the reproducibility control available here; its transitive deps stay
      # unpinned regardless.
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.224 # zizmor: ignore[adhoc-packages]
      - name: Validate plugin manifests and skill frontmatter
        run: bash scripts/lint.sh
      - name: No repo-specific literals in any plugins/*/ entry except reference/, .claude-plugin/, .git/
        run: bash scripts/coupling-check.sh
      # Every gate in ci.yml runs here too -- that is this job's whole contract. A gate
      # added to ci.yml and not added here silently stops applying at the one moment it
      # matters most: the commit consumers actually fetch.
      - name: No known-wrong form has returned
        run: bash scripts/invariants-check.sh
      - name: cursor-drift.sh fixtures
        run: sh tests/cursor-drift.test.sh
      - name: coupling-check.sh fixtures
        run: sh tests/coupling-check.test.sh
      - name: entry-anchor.sh fixtures
        run: sh tests/entry-anchor.test.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The actual bypass boundary is this environment, not the job's own token: its
    # deployment branch policy allows only `main`, and it has a required reviewer. The
    # `release-tag-creation` ruleset's only bypass actor is the App below, and the App's
    # private key lives in this environment's secret -- so the App can mint a tag-creating
    # token only inside a reviewed run of this job. Dry runs go through the same gate on
    # purpose: it is how each one also exercises the approval and the token minting, not
    # only the tag-creation logic.
    environment: release
    permissions:
      contents: read # tag/release creation goes through the App token below, not this one
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes are derived from the log since the previous tag
          persist-credentials: false # the tag is created through the API, not `git push`

      - name: Resolve the version from plugin.json
        id: resolve
        run: |
          set -euo pipefail
          version=$(jq -r '.version' plugins/way-of-working/.claude-plugin/plugin.json)
          # `[[ =~ ]]`, NOT `grep -qE`. `grep` is LINE-oriented: `grep -q` succeeds if ANY
          # line matches, so a version of $'1.2.3\ntag=v9.9.9' passes a `^...$` pattern and
          # then writes a second, attacker-chosen line into $GITHUB_OUTPUT -- last write
          # wins, and the tag stops matching plugin.json. That defeats the one invariant
          # this workflow exists to make structurally impossible. bash `=~` anchors against
          # the whole string, newlines included. `scripts/lint.sh` had the identical bug and
          # is fixed in the same change, so the "two independent layers" is actually true.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json version '$version' is not bare semver"
            exit 1
          fi
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "tag=v$version"      >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Refuse to overwrite an existing tag, or to move backwards
        id: prev
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Re-tagging is how a consumer that pinned this version silently gets different
          # code. Bump plugin.json instead.
          #
          # Note what actually makes re-tagging impossible: `POST /git/refs` is CREATE-ONLY
          # and returns 422 on an existing ref -- moving one needs `PATCH`, which this
          # workflow never calls. This local check exists to fail fast with a useful
          # message, not to be the guarantee.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the version in plugins/way-of-working/.claude-plugin/plugin.json."
            exit 1
          fi
          # `--merged HEAD` is load-bearing: without it this is the highest tag ANYWHERE,
          # so a tag on a divergent branch becomes the notes baseline and `git log
          # "$prev..HEAD"` silently yields an empty or arbitrary changelog on a permanent
          # release.
          prev=$(git tag --list 'v*' --merged HEAD --sort=-v:refname | head -n1)
          if [ -n "$prev" ]; then
            prev_ver="${prev#v}"
            # Tag-uniqueness alone does not imply forward progress: with v0.3.0 present, a
            # plugin.json of 0.2.5 mints v0.2.5 pointing at newer code than v0.3.0. A human
            # reading a version number relies on ordering, not just uniqueness.
            newest=$(printf '%s\n%s\n' "$prev_ver" "$VERSION" | sort -V | tail -n1)
            if [ "$prev_ver" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
              echo "::error::version $VERSION does not move forward from $prev"
              exit 1
            fi
          fi
          echo "previous=$prev" >> "$GITHUB_OUTPUT"

      - name: Build the release notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          # Ancestry-aware, computed and validated in the previous step -- do not recompute
          # it here with a plain `git tag --list`.
          prev: ${{ steps.prev.outputs.previous }}
        run: |
          set -euo pipefail
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..HEAD"
            else
              git log --no-merges --pretty='- %s'
            fi
            echo
            echo "See [\`CHANGELOG.md\`](../blob/$TAG/CHANGELOG.md) for what this tag changes and"
            echo "whether it needs a migration — the commit list above is the record, not the summary."
            echo
            echo "## Consumer pin bumps — staged, not a flat list"
            echo
            echo "Consuming repos pin an exact ref, so **this release changes nothing until each one bumps**"
            echo "\`.claude/settings.json\` → \`extraKnownMarketplaces.claude-workbench.source.ref\` to \`$TAG\`."
            echo "Tracked here as a checklist rather than automated: opening PRs across repos needs a"
            echo "cross-repo write credential in a workflow, which is a bigger decision than this"
            echo "release is worth. An unbumped consumer is at least visible this way."
            echo
            echo "### How to bump — \`claude plugin update\` does **not** do it"
            echo
            echo "Editing the ref in \`.claude/settings.json\` changes what is *pinned*; it does not change"
            echo "what is *registered*, and the registration in \`~/.claude/plugins/known_marketplaces.json\`"
            echo "is what resolves. So \`claude plugin update\` reads the OLD ref and reports **\"already at"
            echo "the latest version\"** while the session goes on loading the old tag — a silent no-op that"
            echo "reports success. It also defaults to \`--scope user\`, which fails outright on the"
            echo "project-scoped install these repos use. Re-registering the marketplace is what actually"
            echo "rotates the pin:"
            echo
            echo '```bash'
            echo "# 1. edit .claude/settings.json:"
            echo "#    extraKnownMarketplaces.claude-workbench.source.ref = $TAG"
            echo "# 2. re-register the marketplace at the new ref — this is the step that does the work"
            echo "claude plugin marketplace add glunk-works/claude-workbench@$TAG --scope project"
            echo "# 3. the uninstall is load-bearing: a plain install short-circuits on \"already installed\""
            echo "claude plugin uninstall way-of-working@claude-workbench --scope project"
            echo "claude plugin install   way-of-working@claude-workbench --scope project"
            echo "# 4. restart the session or run /reload-plugins (not /clear) — a running one keeps executing the copy it started with"
            echo '```'
            echo
            echo "**Verify by commit, not by version string.** The version comes from \`plugin.json\` and can"
            echo "read \`$TAG\` while the installed commit is something else entirely:"
            echo
            echo '```bash'
            echo "jq -r '.plugins[\"way-of-working@claude-workbench\"][] | \"\\(.projectPath) \\(.version) \\(.gitCommitSha)\"' \\"
            echo "  ~/.claude/plugins/installed_plugins.json"
            echo "git ls-remote --tags https://github.com/glunk-works/claude-workbench.git $TAG"
            echo '```'
            echo
            echo "The shas must match, and **every** record for your project must carry that sha — each"
            echo "drive-letter casing on Windows. If one casing lacks it, mirror the record onto that casing"
            echo "as [*Bumping a pinned plugin*](../blob/$TAG/plugins/way-of-working/reference/conventions.md) describes."
            echo "And if \`known_marketplaces.json\` shows **no \`ref\` key at all** for"
            echo "\`claude-workbench\`, the pin has never taken effect on that machine and the repo has been"
            echo "tracking the default branch — check before assuming the previous tag was ever exercised."
            echo
            echo "**Do these in order.** Exact pinning already means a new tag reaches nobody until a"
            echo "human bumps it — so every tag is effectively a release candidate and an \`-rc\` suffix"
            echo "would only re-create, with ceremony, what pinning gives for free. What pinning does"
            echo "*not* give you is a tester: this plugin's real risk is a skill edit that changes agent"
            echo "behaviour in a way \`lint\` and \`coupling\` structurally cannot catch, and the only thing"
            echo "that catches it is running a session. So bump the canary, **use it**, then fan out."
            echo
            echo "### 1. Canary — bump, then run a real session before going further"
            echo
            echo "- [ ] glunk-works/bedrock-serverless-rag"
            echo "- [ ] Ran a real session against it (\`/way-of-working:resume\` through"
            echo "      \`/way-of-working:ship\` at minimum) with no"
            echo "      surprises — this is the step that does the actual verifying; skipping it makes"
            echo "      the staging pointless and the list flat again"
            echo
            echo "### 2. The rest — only after the canary is clean"
            echo
            echo "- [ ] glunk-works/bounty-infra"
            echo "- [ ] 603-Identity/infrastructure-core"
            echo "- [ ] 603-Identity/terraform-cloudflare-dns"
            echo "- [ ] 603-Identity/603identity-site"
            echo
            echo "If the canary turns up a defect: fix it, cut the next version, and leave the repos in"
            echo "stage 2 where they are. **Do not re-tag \`$TAG\`** — a consumer that already bumped"
            echo "would silently get different code, which is the failure this workflow refuses by"
            echo "construction."
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      # `inputs.dry_run` -- NOT `github.event.inputs.dry_run`. The `inputs` context preserves
      # a `type: boolean` input as a real boolean; `github.event.inputs.*` is always a STRING,
      # and the string "false" is truthy, so that spelling would make these two steps both
      # take the dry-run branch and the release would never be created. Do not "simplify".
      - name: Report the plan (dry run only)
        if: inputs.dry_run
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PREVIOUS: ${{ steps.prev.outputs.previous }}
        run: |
          set -euo pipefail
          echo "DRY RUN -- nothing was created."
          echo "Would tag $GITHUB_SHA as $TAG (previous: ${PREVIOUS:-none})."

      # Minted here, not at the top of the job -- this is its only consumer, so this is
      # the whole window it needs to exist in. Still unconditional (no `if:`): a dry run
      # mints it too, which is how a dry run exercises the environment approval and the
      # token minting even though the write call in the next step never runs on dry runs.
      - name: Mint a release token from the claude-workbench-release App
        # SHA-pinned like every other action here. The App is installed only on this repo
        # with Contents read/write + Metadata read -- nothing else. `permission-contents`
        # narrows the minted token to that one permission explicitly, so a later, broader
        # grant on the App's installation would not silently widen this token too. The
        # rulesets stop this token moving or deleting `v*` tags -- but that's ALL they
        # stop; Contents write still lets it edit or delete releases and write other refs.
        # What actually contains it there is operational, not the rulesets: it lives for
        # one fixed-argv step, that step runs only pinned code, and it is revoked at job
        # end.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create the tag and the release
        if: ${{ !inputs.dry_run }}
        env:
          # The App token, not `github.token` -- this job's own GITHUB_TOKEN is read-only
          # (see `permissions:` above), so `contents: write` for this one call comes only
          # from a token scoped to the App, minted only inside this reviewed environment.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ONE call, deliberately. This was two -- `gh api .../git/refs` to create the tag,
          # then `gh release create` -- which is not atomic: a transient failure between them
          # leaves the tag created and the release missing, and the "refuse to overwrite"
          # guard then blocks the retry while telling you to bump the version. That burns a
          # version number over a network blip, on a workflow whose whole cost model is that
          # tags are permanent.
          #
          # `--target` creates the tag as part of creating the release. Still no credential
          # on disk: `gh` uses GH_TOKEN from the environment, not the git remote.
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
          echo "Released $TAG at $SHA"
