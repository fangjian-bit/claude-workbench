# Keeps the SHA-pinned GitHub Actions current.
#
# SCOPE, stated because it is easy to assume this covers more than it does: this repo has
# NO package manifests -- no package.json, no requirements.txt, no go.mod. The dependency
# surface is the actions used by `ci.yml` and `release.yml`, plus the base image on the
# `.devcontainer/Dockerfile` FROM line and the one on `scripts/identity/review/Dockerfile`, so
# `github-actions` and `docker` are the only ecosystems that apply. Adding another entry here
# would silently do nothing, which is worse than no entry: it reads as coverage.
#
# NOT COVERED, named deliberately: `release.yml` installs the Claude CLI with
# `npm install -g @anthropic-ai/claude-code@2.1.224`. A version pinned inside a `run:`
# step is invisible to Dependabot -- it reads manifests and workflow `uses:` values, not
# shell commands. **That pin is bumped by hand.** (`ci.yml` installs the same package
# unpinned on purpose; only the release path needs reproducibility, and `release.yml` says
# so at the step.) The Dockerfile pins are bumped by hand too, for their own reason:
# `scripts/loop/Dockerfile`'s `ARG BASE_IMAGE` (a templated `FROM`, and there is no
# `/scripts/loop` entry below) and both images' `CLAUDE_VERSION` / `CLAUDE_SHA256` (a download
# in a `RUN`, not a `FROM`), which `tests/review-image.test.sh` holds equal. If the
# `release.yml` hand-bump is ever missed often enough to matter, the fix is a real manifest for
# Dependabot to read, not another entry below.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/" # covers .github/workflows/**
    schedule:
      interval: weekly
      day: monday

    # A newly published action version is a newly published action version -- give it a
    # week before Dependabot proposes it, so a same-day supply-chain compromise or an
    # under-tested release has time to surface before this repo pulls it in. 7 is
    # zizmor's own `dependabot-cooldown` default; keeping it there rather than picking a
    # different number means one less thing to justify diverging from.
    cooldown:
      default-days: 7

    # The actions are pinned by full commit SHA with a trailing `# v5` comment. That is
    # the supply-chain-safe form -- a tag is mutable, a SHA is not -- and Dependabot
    # updates BOTH the SHA and the version comment together, so the pin style survives
    # and stays legible. This is the setup Dependabot handles best, not a workaround.
    #
    # These PRs are reviewed and merged by a human like any other. No auto-merge:
    # an armed auto-merge needs a required code-owner approval (reference/conventions.md), which this
    # repo does not have until its WB-D24 cutover, and an action bump is
    # a change to the code that runs every gate in this repo.

    # One PR for all action bumps rather than one per action. With few actions the noise
    # saving is small; the reason that matters is the PR TITLE. A squash merge makes the
    # title the commit subject on the base branch, so it is the enforced surface
    # (reference/conventions.md, "PR titles use the same grammar", <= 72 chars), and a
    # grouped update keeps it short and stable instead of naming each action.
    groups:
      actions:
        patterns: ["*"]

    # Dependabot's default subject is "Bump X from Y to Z" -- not Conventional Commits,
    # and it would land on the base branch as a non-conforming subject. `ci` is the right
    # type: this is the build surface, nothing a consumer of the plugin ever sees.
    # Produces `ci(deps): ...`.
    commit-message:
      prefix: ci
      include: scope

    labels:
      - dependencies

    open-pull-requests-limit: 3

  # The dev container's base image, pinned by tag AND digest on the Dockerfile's FROM line.
  # Once the template's `verify / verify` workflow is adopted, a bump must pass its image check
  # (first-attempt build, signed provenance); until then, check the attestation by hand with the
  # command in the Dockerfile header. The `# syntax=` frontend pin in the same file is not
  # bumped by Dependabot; the template owns it.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    open-pull-requests-limit: 3

  # The review image's base image (#634), a literal tag-and-digest FROM line with no ARG before
  # it. The same shape as the entry above, but a separate PR: nothing keeps the two pins equal.
  # The base image's signed provenance is not verified for this directory, so a bump gets human
  # review only; check the attestation by hand with the command in .devcontainer/Dockerfile.
  - package-ecosystem: docker
    directory: /scripts/identity/review
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    open-pull-requests-limit: 3
