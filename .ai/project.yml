# ── identity ─────────────────────────────────────────────────────────────────
repo: glunk-works/claude-workbench
pr_base: main
migration_base: null   # no migration under way (WB-D17, #142 — this key must be present).

# ── the deep record ──────────────────────────────────────────────────────────
# This repo has no separate roadmap-with-status-table — it ships as small,
# single-task PRs (#22, #24-27), and docs/decisions.md's own "Status" section is
# the closest thing to a live status + next-action record. sprints_dir is
# declared per the schema's expectation but stays empty: sprint plans live as
# GitHub milestones (planning.kind below), never as sprints_dir/*/sprint_plan.md.
roadmap: docs/decisions.md
sprints_dir: sprints
threat_model: docs/decisions.md

planning:
  kind: github_milestones   # each sprint is one milestone; #86 is what makes this readable.

decisions:
  log: docs/decisions.md
  prefix: WB-D

backlog:
  kind: github_issues
  repo: null
  path: null
  item_prefix: null

load_bearing_docs:
  - README.md
  - docs/decisions.md
  - CHANGELOG.md
  - plugins/way-of-working/reference/project-schema.md
  - plugins/way-of-working/reference/conventions.md
  - plugins/way-of-working/reference/workflow.md
  - .ai/next-steps.md

# ── what counts as a behavior change ─────────────────────────────────────────
code_paths:
  - plugins/
  - scripts/
  - .github/workflows/
  - .claude-plugin/

# ── the local green gate ─────────────────────────────────────────────────────
gates:
  green:
    - { run: bash scripts/lint.sh }
    - { run: bash scripts/coupling-check.sh }
    - { run: bash scripts/invariants-check.sh }

# ── branch protection ────────────────────────────────────────────────────────
ruleset:
  name: protected-integration-branches
  rule_types: [deletion, non_fast_forward, pull_request, required_status_checks]
  required_checks: [lint, coupling, invariants]

# ── the fresh-session review gate ────────────────────────────────────────────
review:
  ci_gate: null   # no hitl-review.yml in this repo — not adopted here (yet).

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
models:
  architect: opus
  coder: sonnet
  second_opinion: fable

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
# Plan v9 § 8.4 / § 8.5 / § 8.12. human_only_paths keeps a loop task off CI, the repo gate
# scripts under scripts/, the cursor, this file and the release manifests -- a task
# that could edit them could widen its own authority. plugins/way-of-working/bin/ is
# deliberately NOT listed: it is this repo's product, so the loop must be able to work
# there, under the critic floor (code_paths) and the human merge.
orchestration:
  critics: [architect, security-critic, docs-consistency]
  round_cap: 2
  human_only_paths:
    - .github/
    - .ai/
    - .claude/
    - .claude-plugin/
    - plugins/way-of-working/.claude-plugin/
    - scripts/
    - scripts/identity/
    - .devcontainer/
    - CLAUDE.md
  restrict_updates: restrict-updates-to-main
  loop_identity: "glunk-loop[bot]"

# ── declared identities ──────────────────────────────────────────────────────
# WB-D24 (#378): declared at this repo's cutover; trust is by numeric id, never author_association.
identities:
  maintainer:
    - { login: Seuss27, id: 22668449 }
  dev_app: { login: "glunk-dev[bot]", id: 339840170 }
  reviewer_app: { login: "glunk-review[bot]", id: 339841158 }
  loop_app: { login: "glunk-loop[bot]", id: 338193635 }
